appId: com.sewbrowser.app
productName: SEWBrowser
directories:
  output: release
files:
  - "out/**/*"
extraResources:
  - from: "features/"
    to: "features/"
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
