appId: com.sewbrowser.app
productName: SEWBrowser
directories:
  output: release
files:
  - "out/**/*"
extraResources:
  - from: "features/"
    to: "features/"
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Без пробелов: latest.yml должен ссылаться на имя, которое GitHub не
  # переименует при заливке (пробелы -> точки, 404 в autoUpdater, см. 0.6.0).
  artifactName: "${productName}-Setup-${version}.${ext}"
publish:
  provider: github
  owner: "Monutor"
  repo: "SEWBrowser"
