appId: com.sewbrowser.app
productName: SEWBrowser
directories:
  output: release
files:
  - "out/**/*"
extraResources:
  - from: "features/"
    to: "features/"
  # Локальная база полок склада: список полок для плагина sew-helper. Файл
  # обновляется новой версией SEWBrowser, пользователь его не правит.
  - from: "src/database/shelves.json"
    to: "database/shelves.json"
  # Локальная база штрихов db.json: источник для печати листов штрихов и для
  # кнопки «ШК по артикулу» в гостевом плагине. Лежит gzip'ом (11 МБ), в
  # распакованный вид попадает только в память процесса при сборке индекса.
  - from: "src/database/db.json"
    to: "database/db.json"
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Без пробелов: latest.yml должен ссылаться на имя, которое GitHub не
  # переименует при заливке (пробелы -> точки, 404 в autoUpdater, см. 0.6.0).
  artifactName: "${productName}-Setup-${version}.${ext}"
publish:
  provider: github
  owner: "Monutor"
  repo: "SEWBrowser"
