<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>SEWBrowser</title>
  </head>
  <body>
    <div id="titlebar">
      <span class="app-title"><img class="app-icon" src="./icon.png" alt="" />SEWBrowser</span>
      <div class="window-controls">
        <button id="btn-min" title="Свернуть">&#9472;</button>
        <button id="btn-max" title="Развернуть/свернуть">&#9633;</button>
        <button id="btn-close" title="Закрыть">&times;</button>
      </div>
    </div>

    <div id="toolbar">
      <button id="btn-back" title="Назад"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>
      <button id="btn-forward" title="Вперёд"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
      <button id="btn-reload" title="Перезагрузить"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>
      <input id="address" spellcheck="false" autocomplete="off" />
      <button id="btn-accounts" title="Аккаунты SEW (Ctrl+Shift+L)">&#128273;</button>
      <button id="btn-downloads" title="Загрузки">&#128229;</button>
      <button id="btn-settings" title="Настройки">&#9881;</button>
      <div id="downloads" hidden title="Загрузки"></div>
      <span id="status"></span>
    </div>

    <div id="findbar" hidden>
      <input id="find-input" placeholder="Найти на странице" autocomplete="off" />
      <span id="find-count"></span>
      <button id="find-prev" title="Предыдущее">&#8593;</button>
      <button id="find-next" title="Следующее">&#8595;</button>
      <button id="find-close" title="Закрыть">&times;</button>
    </div>

    <div id="updatebar" hidden>
      <span id="update-text"></span>
      <button id="update-action"></button>
      <button id="update-close" title="Скрыть">&times;</button>
    </div>

    <div id="error-overlay" hidden>
      <div class="error-card">
        <div class="error-title">Не удалось открыть страницу</div>
        <div id="error-text" class="error-text"></div>
        <button id="error-retry">Повторить</button>
      </div>
    </div>

    <div id="settings-overlay" hidden>
      <div class="settings-card">
        <div class="settings-title">Настройки</div>
        <label class="settings-row">
          Стартовый URL
          <input id="set-starturl" spellcheck="false" autocomplete="off" />
        </label>
        <label class="settings-row settings-check">
          <input id="set-allowlist-enabled" type="checkbox" />
          Проверять allowlist
        </label>
        <label class="settings-row">
          Allowlist (по одному шаблону на строку)
          <textarea id="set-allowlist" rows="4" spellcheck="false"></textarea>
        </label>
        <div class="settings-row">
          Плагины (переключение применится при следующей загрузке страницы)
          <div id="set-plugins"></div>
        </div>
        <div class="settings-row">
          Хранилище
          <div id="set-storage-usage" class="storage-usage">…</div>
          <div class="settings-btn-row">
            <button id="set-clear-cache">Очистить кэш</button>
            <button id="set-clear-cookies">Очистить куки</button>
          </div>
          <div id="set-cookies" class="cookies-list"></div>
        </div>
        <label class="settings-row">
          При выходе из оболочки
          <select id="set-clear-on-exit">
            <option value="none">Ничего не очищать</option>
            <option value="cache">Очищать HTTP-кэш</option>
            <option value="all">Очищать всё (кэш и хранилища)</option>
          </select>
        </label>
        <div class="settings-actions">
          <button id="set-save">Сохранить</button>
          <button id="set-cancel">Отмена</button>
        </div>
        <div class="settings-danger">
          <button id="set-clear-session">Очистить данные сессии и выйти</button>
        </div>
      </div>
    </div>

    <div id="accounts-overlay" hidden>
      <div class="accounts-card">
        <div class="settings-title">Аккаунты SEW</div>
        <div class="settings-row">Выберите аккаунт для входа или добавьте новый (пароли хранятся в шифрохранилище Windows):</div>
        <div id="set-accounts" class="accounts-list"></div>
        <div class="settings-btn-row">
          <button id="acc-add">+ Добавить аккаунт</button>
        </div>
        <div id="acc-form" hidden>
          <label class="settings-row">
            ФИО (подпись, чтобы различать аккаунты)
            <input id="acc-fio" autocomplete="off" />
          </label>
          <label class="settings-row">
            Табельный номер
            <input id="acc-tabnum" autocomplete="off" />
          </label>
          <label class="settings-row">
            Пароль
            <span class="password-wrap">
              <input id="acc-password" type="password" autocomplete="new-password" />
              <button id="acc-eye" title="Показать/скрыть пароль" type="button">&#128065;</button>
            </span>
          </label>
          <div class="settings-btn-row">
            <button id="acc-save">Сохранить аккаунт</button>
            <button id="acc-cancel">Отмена</button>
          </div>
        </div>
        <button id="accounts-cancel">Закрыть (Esc)</button>
      </div>
    </div>

    <div id="downloads-overlay" hidden>
      <div class="downloads-card">
        <div class="settings-title">Загрузки</div>
        <div class="settings-row">
          Кто скачал
          <select id="downloads-filter">
            <option value="">Все сотрудники</option>
          </select>
        </div>
        <div id="downloads-history" class="downloads-history"></div>
        <div class="settings-actions">
          <button id="downloads-clear">Очистить список</button>
          <button id="downloads-close">Закрыть (Esc)</button>
        </div>
      </div>
    </div>

    <webview id="site" allowpopups></webview>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
